plugins {
    id 'com.android.application'
}

android {
    namespace 'com.natis.nuvctest'
    compileSdk 34
    ndkPath "C:/Program Files/Unity/Hub/Editor/6000.5.10f1/Editor/Data/PlaybackEngines/AndroidPlayer/NDK"

    defaultConfig {
        applicationId 'com.natis.nuvctest'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { pickFirsts += ['**/libc++_shared.so'] }
    }
}

dependencies {
    implementation project(':nuvc')
}
